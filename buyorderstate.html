<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大吃一斤 || 訂單查詢</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        body { margin: 0; background-color: #fffaf3; font-family: "微軟正黑體", sans-serif; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10%;
            background-color: #f8fadc;
            height: 90px;
        }
        .logo img { height: 70px; width: auto; border-radius: 50%; }
        .cart-btn img { width: 35px !important; height: 35px !important; object-fit: contain; }

        .nav {
            background-color: #ff7a00;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 12px 0;
        }
        .nav a { color: white; text-decoration: none; font-weight: bold; }

        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        .order-info-card {
            background: #fffcf0;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #ffe3b3;
            margin-bottom: 30px;
            display: inline-block;
            min-width: 300px;
            text-align: left;
        }

        .status { 
            list-style: none; padding: 0; margin: 30px auto; 
            max-width: 200px;
            text-align: left; 
        }
        .status li { 
            padding: 15px 0 15px 40px; border-left: 3px solid #eee; 
            position: relative; color: #bbb; 
        }
        .status li::after { 
            content: ""; position: absolute; left: -9px; top: 18px; 
            width: 14px; height: 14px; background: #ddd; border-radius: 50%; 
        }
        .status li.active { color: #ff7a00; font-weight: bold; border-left-color: #ff7a00; }
        .status li.active::after { background: #ff7a00; box-shadow: 0 0 8px rgba(255,122,0,0.5); }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo"><a href="index.html"><img src="image/logo.png"></a></div>
        <div class="search-cart">
            <div class="cart-btn"><a href="buycart.html"><img src="image/images.png"></a></div>
            <div class="account"><a href="memberset.html" style="text-decoration:none; color:#333; font-size:24px;">👤</a></div>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html">首頁</a>
        <a href="index.html#products">商品分類</a>
        <a href="buyorderstate.html">訂單查詢</a>
    </nav>

    <div class="main-container">
        <h2 style="margin-bottom: 25px; color: #333;">訂單狀態查詢</h2>
        
        <div id="content">
            <div class="order-info-card">
                <p style="margin-bottom: 10px;">訂單編號：<strong id="displayOrderId">載入中...</strong></p>
                <p>應付金額：<strong id="displayTotal" style="color: #d35400; font-size: 20px;">$0</strong></p>
            </div>

            <ul class="status">
                <li id="step1">訂單成立</li>
                <li id="step2">處理中</li>
                <li id="step3">已出貨</li>
                <li id="step4">已完成取貨</li>
            </ul>
        </div>
        
        <div style="margin-top: 30px;">
            <a href="index.html" class="set" style="background-color: #ff7a00; color: white; padding: 12px 40px; border-radius: 8px; text-decoration: none; font-weight: bold;">回到首頁</a>
        </div>
    </div>

    <script>
        const orderData = JSON.parse(localStorage.getItem("lastOrder"));
        
        if (orderData) {
            document.getElementById("displayOrderId").textContent = orderData.id;
            document.getElementById("displayTotal").textContent = "$" + orderData.total;

            document.getElementById("step1").classList.add("active");
        } else {
            document.getElementById("content").innerHTML = `
                <div style="padding: 60px; color: #999;">
                    <p style="font-size: 18px;">目前沒有進行中的訂單紀錄</p>
                </div>`;
        }
    </script>
</body>
</html>
