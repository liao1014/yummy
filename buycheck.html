<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大吃一斤 || 下單</title>
    <link rel="stylesheet" href="buy.css">
</head>
<body>
    <header>
        <h1>大吃一斤</h1>
    </header>

    <div class="buy01">
        <h2>確認訂單</h2>
        <form action="buyorder.html">
            <label>收件人姓名 <input type="text" id="name" required></label><br>
            <label>電話 <input type="tel" id="phone" required></label><br>
            <label>地址 <input type="text"  id="address" required></label><br>
            <div class="total">商品總金額：$<span id="orderTotal">0</span></div>
        <button type="submit">確認下單</button>
        </form>
    </div>

    <script src="./core.js"></script>
    <script>
        const cart = getCart();
        const totalSpan = document.getElementById("orderTotal");

        const total = cart.reduce((t, p) => t + (p.price * p.qty), 0);
        totalSpan.innerText = total;

        document.getElementById("orderForm").onsubmit = function(e) {
            e.preventDefault(); 

            const orderData = {
                customer: {
                    name: document.getElementById("name").value,
                    phone: document.getElementById("phone").value,
                    address: document.getElementById("address").value
                },
                items: cart,
                total: total,
                time: new Date().toLocaleString()
            };

            if (typeof saveOrder === "function") {
            saveOrder(orderData);
            }alert("下單成功！");
            location.href = "buyorder.html"; 
    };
    </script> 
</body>
</html>
