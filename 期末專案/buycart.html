<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大吃一斤 || 購物車</title>
    <link rel="stylesheet" href="buy.css">
    <script>
        function goCheckout() {
            const isLogin = localStorage.getItem("isLogin");
        
            if (isLogin === "true") {
                location.href = "buycheck.html";
            } else {
                location.href = "membersign.html?from=cart";
            }
        }
    </script>
</head>
<body>
    <header>
        <h1>大吃一斤</h1>
        <a href="membersign.html">會員登入</a>
    </header>

    <div class="buy01">
        <h2>購物車</h2>
        <ul id="list"></ul>
        <p>總金額：<span id="totalPrice">0</span> 元</p>
        <a href="#" class="set" onclick="goCheckout()">前往結帳</a>
    </div>

    <script src="./core.js"></script>
    <script>
        let cart = getCart();
        const list = document.getElementById("list");
        const totalDisplay = document.getElementById("totalPrice");

        function render(){
            list.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                list.innerHTML = "<li>購物車是空的</li>";
                totalDisplay.innerText = "0";
                return;
            }

            cart.forEach((p, i) => {
                const itemQty = Number(p.qty) || 0;
                const itemTotal = p.price * itemQty;
                total += itemTotal;

                list.innerHTML += `
                    <div class="cart-item" style="border-bottom: 1px solid #ccc; padding: 10px;">
                    <span>${p.name}</span> - $${p.price} x ${p.qty} = $${itemTotal}
                    <button onclick="del(${i})">刪除</button>
                </div>`;
            });
            totalDisplay.innerText = total;
        }

        function del(i) {
            cart.splice(i, 1);
            saveCart(cart);
            render();
        }

        function goCheckout() {
            if (typeof isLogin === "function" && isLogin()) {
                location.href = "buycheck.html";
            } else {
                alert("請先登入！");
                location.href = "membersign.html?from=cart";
            }
        }

        render();
    </script>
</body>
</html>
