<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大吃一斤 || 會員註冊</title>
    <link rel="stylesheet" href="member.css">
</head>
<body>
    <div class="member01">

        <h2>會員註冊</h2>
        <form action="membersign.html">
            <label>姓名
                <input type="text" required />
            </label>
            <label>電子信箱
                <input type="email" required placeholder="example@mail.com" />
            </label>
            <label>密碼
                <input type="password" placeholder="至少8位數字" />
            </label>
            <button type="submit">註冊</button>
        </form>
        <div class="link">
            已有帳號？<a href="membersign.html">返回登入</a>
        </div>
    </div>
</body>
</html>
