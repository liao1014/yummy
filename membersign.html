<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大吃一斤 || 會員登入</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background-color: #f8fadc; }
        .logo { display: flex; align-items: center; gap: 8px; }
        .logo img { height: 80px; width: 80px; border-radius: 50%; }

        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .auth-container h2 { text-align: center; color: #ff7a00; }
        .auth-container label { display: block; margin: 15px 0 5px; }
        .auth-container input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .auth-container button { width: 100%; padding: 12px; background: #ff7a00; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        .auth-container .switch { text-align: center; margin-top: 15px; font-size: 14px; }
        .auth-container .switch a { color: #007bff; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; display: flex; align-items: center; color: black;">
                <img src="image/logo.png" alt="大吃一斤 Logo">
                <h1 style="margin-left:10px; font-size: 24px;">大吃一斤</h1>
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div id="login-box">
            <h2>會員登入</h2>
            <form onsubmit="handleLogin(event)">
                <label>電子信箱 (Email)</label>
                <input type="email" id="login-email" required placeholder="example@mail.com">
                <label>密碼</label>
                <input type="password" id="login-pw" required>
                <button type="submit">登入</button>
            </form>
            <div class="switch">尚未註冊？ <a onclick="toggleAuth()">立即註冊</a></div>
        </div>

        <div id="register-box" style="display: none;">
            <h2>新會員註冊</h2>
            <form onsubmit="handleRegister(event)">
                <label>電子信箱 (Email)</label>
                <input type="email" id="reg-email" required>
                <label>姓名</label>
                <input type="text" id="reg-name" required>
                <label>設定密碼</label>
                <input type="password" id="reg-pw" required>
                <button type="submit">完成註冊</button>
            </form>
            <div class="switch">已有帳號？ <a onclick="toggleAuth()">回登入頁</a></div>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const loginBox = document.getElementById('login-box');
            const regBox = document.getElementById('register-box');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                regBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const name = document.getElementById('reg-name').value;
            const password = document.getElementById('reg-pw').value;

            const userData = {
                email: email,
                name: name,
                password: password, 
                signup: new Date().toLocaleDateString()
            };

            localStorage.setItem("memberData", JSON.stringify(userData));
            alert("註冊成功！請重新登入");
            toggleAuth();
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pw').value;

            const savedData = JSON.parse(localStorage.getItem("memberData"));

            if (savedData && savedData.email === email && savedData.password === password) {
                localStorage.setItem("isLogin", "true");
                alert("登入成功！");

                const params = new URLSearchParams(window.location.search);
                if (params.get("from") === "cart") {
                    location.href = "buycheck.html";
                } else {
                    location.href = "index.html";
                }
            } else {
                alert("帳號或密碼錯誤！");
            }
        }
    </script>
</body>
</html>
